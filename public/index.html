<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Informasi Kampus</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-[#090d16] text-zinc-100 min-h-screen p-4 md:p-8 antialiased">

  <div class="max-w-5xl mx-auto space-y-8">
    
    <!-- Header -->
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-zinc-800 pb-6">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-white">Dashboard Mahasiswa</h1>
        <p class="text-sm text-zinc-400 mt-1">Kelola data akademik mahasiswa secara langsung.</p>
      </div>
      <button onclick="openModal()" class="inline-flex items-center justify-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm rounded-lg transition-all shadow-lg shadow-indigo-600/20 active:scale-95">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        Tambah Mahasiswa
      </button>
    </header>

    <!-- Main Content Grid -->
    <main class="space-y-4">
      <!-- Search Bar -->
      <div class="relative">
        <input type="text" id="searchInput" onkeyup="filterData()" placeholder="Cari berdasarkan nama atau NIM..." class="w-full bg-zinc-900/80 border border-zinc-800 rounded-xl px-4 py-3 pl-10 text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-zinc-700 transition">
        <svg class="w-4 h-4 absolute left-3.5 top-3.5 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      </div>

      <!-- Table Container -->
      <div class="bg-zinc-900/50 border border-zinc-800/80 rounded-xl overflow-hidden backdrop-blur-sm">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-zinc-950/60 border-b border-zinc-800 text-zinc-400 uppercase text-[11px] tracking-wider font-semibold">
              <tr>
                <th class="px-6 py-3.5">NIM</th>
                <th class="px-6 py-3.5">Nama Lengkap</th>
                <th class="px-6 py-3.5">Program Studi</th>
                <th class="px-6 py-3.5 text-right">Aksi</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-zinc-800/60 text-zinc-300">
              <tr>
                <td colspan="4" class="text-center py-8 text-zinc-500">Memuat data...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Form (Tambah & Edit) -->
  <div id="modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
    <div class="bg-zinc-900 border border-zinc-800 w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-6">
      <div class="flex justify-between items-center border-b border-zinc-800 pb-4">
        <h3 id="modalTitle" class="text-lg font-semibold text-white">Tambah Mahasiswa</h3>
        <button onclick="closeModal()" class="text-zinc-400 hover:text-white transition">&times;</button>
      </div>

      <form id="studentForm" onsubmit="handleSubmit(event)" class="space-y-4">
        <input type="hidden" id="studentId">
        
        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1">NIM</label>
          <input type="text" id="nim" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3.5 py-2 text-sm text-zinc-200 focus:outline-none focus:border-indigo-500 transition">
        </div>

        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1">Nama Lengkap</label>
          <input type="text" id="nama_lengkap" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3.5 py-2 text-sm text-zinc-200 focus:outline-none focus:border-indigo-500 transition">
        </div>

        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1">Program Studi</label>
          <input type="text" id="program_studi" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3.5 py-2 text-sm text-zinc-200 focus:outline-none focus:border-indigo-500 transition">
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-zinc-800">
          <button type="button" onclick="closeModal()" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs font-medium rounded-lg transition">Batal</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium rounded-lg transition">Simpan Data</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_URL = '/api/mahasiswa';
    let rawData = [];

    // 1. GET (Read All)
    async function fetchData() {
      try {
        const res = await fetch(API_URL);
        rawData = await res.json();
        renderTable(rawData);
      } catch (err) {
        document.getElementById('tableBody').innerHTML = `
          <tr><td colspan="4" class="text-center py-8 text-rose-500">Gagal memuat data dari server.</td></tr>
        `;
      }
    }

    function renderTable(data) {
      const tbody = document.getElementById('tableBody');
      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-zinc-500">Tidak ada data mahasiswa.</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(m => `
        <tr class="hover:bg-zinc-800/30 transition">
          <td class="px-6 py-4 font-mono text-zinc-400 text-xs">${m.nim}</td>
          <td class="px-6 py-4 font-medium text-white">${m.nama_lengkap}</td>
          <td class="px-6 py-4">
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-zinc-800 text-zinc-300 border border-zinc-700">
              ${m.program_studi}
            </span>
          </td>
          <td class="px-6 py-4 text-right space-x-2">
            <button onclick="editModal('${m.id}', '${m.nim}', '${m.nama_lengkap}', '${m.program_studi}')" class="text-xs font-medium text-amber-400 hover:text-amber-300 transition">Edit</button>
            <button onclick="deleteData('${m.id}')" class="text-xs font-medium text-rose-400 hover:text-rose-300 transition">Hapus</button>
          </td>
        </tr>
      `).join('');
    }

    // 2. POST (Create) & PUT (Update)
    async function handleSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('studentId').value;
      const payload = {
        nim: document.getElementById('nim').value,
        nama_lengkap: document.getElementById('nama_lengkap').value,
        program_studi: document.getElementById('program_studi').value,
      };

      const method = id ? 'PUT' : 'POST';
      const url = id ? `${API_URL}/${id}` : API_URL;

      await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      closeModal();
      fetchData();
    }

    // 3. DELETE
    async function deleteData(id) {
      if (!confirm('Yakin ingin menghapus data ini?')) return;
      await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
      fetchData();
    }

    // Filter Search
    function filterData() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = rawData.filter(m => 
        m.nama_lengkap.toLowerCase().includes(q) || m.nim.toLowerCase().includes(q)
      );
      renderTable(filtered);
    }

    // Modal Helpers
    function openModal() {
      document.getElementById('modalTitle').innerText = 'Tambah Mahasiswa';
      document.getElementById('studentForm').reset();
      document.getElementById('studentId').value = '';
      document.getElementById('modal').classList.remove('hidden');
    }

    function editModal(id, nim, nama, prodi) {
      document.getElementById('modalTitle').innerText = 'Edit Mahasiswa';
      document.getElementById('studentId').value = id;
      document.getElementById('nim').value = nim;
      document.getElementById('nama_lengkap').value = nama;
      document.getElementById('program_studi').value = prodi;
      document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    // Load initial data
    fetchData();
  </script>
</body>
</html>
